<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Captain Liivo</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="game-frame" aria-label="Captain Liivo game">
        <header class="hud" aria-live="polite">
          <div>
            <span class="label">Score</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span class="label">Planet</span>
            <strong id="planet">100%</strong>
          </div>
          <div>
            <span class="label">Hull</span>
            <strong id="hull">100%</strong>
          </div>
          <div>
            <span class="label">State</span>
            <strong id="state">Ready</strong>
          </div>
        </header>

        <canvas id="game" width="390" height="720"></canvas>

        <div class="overlay" id="overlay">
          <h1>Captain Liivo</h1>
          <p>Defend the ringed planet, outfly the UFO lasers, and punch through the asteroid field.</p>
          <button id="startButton" class="primary" type="button">Launch</button>
        </div>

        <div class="touch-controls" aria-label="Touch controls">
          <div class="pad" aria-hidden="false">
            <button class="touch up" data-control="up" type="button" title="Up" aria-label="Up"><span></span></button>
            <button class="touch left" data-control="left" type="button" title="Left" aria-label="Left"><span></span></button>
            <button class="touch down" data-control="down" type="button" title="Down" aria-label="Down"><span></span></button>
            <button class="touch right" data-control="right" type="button" title="Right" aria-label="Right"><span></span></button>
          </div>
          <button class="touch fire" data-control="fire" type="button" title="Fire" aria-label="Fire"><span></span></button>
        </div>
      </section>
    </main>

    <script type="module" src="./src/game.js"></script>
  </body>
</html>
